<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery DOM Operations</title>
    <style>
        .myStyle {
            background-color: coral;
            padding: 16px;
        }
    </style>
    <!-- Include jQuery 4.0.0 CDN -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>

<body>

    <div id="myElement">Original Text</div>
    <div id="myDIV">
        <p>I am a myDIV.</p>
    </div>
    <button id="myButton">Click me</button>

    <script>
        $(document).ready(function () {
            // (a) Replace text of #myElement with "Modified Text"
            $("#myElement").text("Modified Text");

            // (b) Add the myStyle class to #myDIV
            $("#myDIV").addClass("myStyle");

            // (c) Respond to a click on #myButton by showing "Button clicked!"
            $("#myButton").on("click", function () {
                alert("Button clicked!");
            });
        });
    </script>
</body>

</html>
